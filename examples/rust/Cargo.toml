[package]
name = "native-rust-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
publish = false

[[bin]]
name = "native-rust-client"
path = "src/main.rs"

[[bin]]
name = "rust-crud-client"
path = "src/crud.rs"

[dependencies]
duckdb = { version = "=1.10506.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.dev]
debug = 0
