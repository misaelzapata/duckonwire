name: Documentation and executable tutorial
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_artifact:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check guide links, anchors and code fences
        run: cmake -DSOURCE_DIR="$PWD" -DREPORT_FILE="$PWD/build/documentation.json" -P cmake/DocumentationTests.cmake
      - name: Check the shell installer
        run: sh tests/install_smoke.sh > build/installer.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: documentation-structure
          path: |
            build/documentation.json
            build/installer.json
          if-no-files-found: error
  executable-tutorial:
    needs: guide
    uses: ./.github/workflows/postgres.yml
    with:
      package_artifact: ${{ inputs.package_artifact || '' }}
    # Uses this run's fresh package, or builds the exact current pins, checks
    # --help, and runs native/protocol tests and C/Python/Node TLS/SCRAM examples.
    # Two million bound rows overlap ten demo queries across protected clients.
    # Private S3/R2 accounts and credentials are intentionally absent from CI.
