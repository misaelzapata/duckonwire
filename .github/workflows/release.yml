name: Build, test and publish a release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, without the v prefix
        required: true
        default: 0.3.0
        type: string
      prerelease:
        description: Mark this release as a prerelease
        default: true
        type: boolean
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate version and refuse an existing tag
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $pattern ]]; then
            printf 'Invalid semantic version: %s\n' "$VERSION" >&2
            exit 1
          fi
          base=${VERSION%%+*}
          if [[ "$base" == *-* ]]; then
            IFS=. read -ra identifiers <<< "${base#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then
                printf 'Numeric prerelease identifiers cannot have leading zeros\n' >&2
                exit 1
              fi
            done
          fi
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            printf 'Tag already exists; releases are never overwritten: %s\n' "$tag" >&2
            exit 1
          else
            status=$?
            test "$status" = 2
          fi
          printf 'version=%s\ntag=%s\n' "$VERSION" "$tag" >> "$GITHUB_OUTPUT"
  native:
    needs: validate
    uses: ./.github/workflows/verify.yml
    with:
      version: ${{ needs.validate.outputs.version }}
  documentation:
    needs: native
    uses: ./.github/workflows/documentation.yml
    with:
      package_artifact: ${{ needs.native.outputs.package_artifact }}
  docker:
    needs: validate
    uses: ./.github/workflows/docker.yml
  publish:
    needs: [validate, native, documentation, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      WORKFLOW_TOKEN: ${{ github.token }}
      GH_CONFIG_DIR: /tmp/duckonwire-release-auth-${{ github.run_id }}-${{ github.run_attempt }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.native.outputs.package_artifact }}
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: native-test-results
          path: proof/native
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: postgres-linux-results
          path: proof/postgres
      - name: Verify current-run provenance and prepare release files
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd dist && sha256sum --check "duckonwire-$VERSION-linux-x86_64-v3.sha256")
          git archive HEAD --format=tar.gz --prefix="duckonwire-$VERSION/" \
            --output="dist/duckonwire-$VERSION-source.tar.gz"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const required = (ok, text) => { if (!ok) throw new Error(text); };
          const version = process.env.VERSION, head = process.env.GITHUB_SHA;
          const summary = JSON.parse(fs.readFileSync('proof/native/test-results/test-summary.json', 'utf8'));
          const fdw = JSON.parse(fs.readFileSync('proof/postgres/postgres-fdw.json', 'utf8'));
          const packageName = `duckonwire-${version}-linux-x86_64-v3`;
          const manifest = JSON.parse(fs.readFileSync(`dist/${packageName}.manifest.json`, 'utf8'));
          required(Object.values(JSON.parse(process.env.NEEDS_JSON)).every(job => job.result === 'success'), 'A required workflow did not pass');
          required(summary.passed && summary.unique_checks === 112 && summary.source_head === head, 'Native checks are incomplete or from another commit');
          required(manifest.source_head === head, 'Package source differs from the workflow commit');
          required(fs.readFileSync('proof/postgres/source-head.txt', 'utf8').trim() === head, 'Driver checks are from another commit');
          required(fdw.passed && fdw.owned_fixture_cleanup_complete && fdw.checks.length === 20 && fdw.checks.every(check => check.passed), 'FDW checks are incomplete');
          required(fdw.server_sha256 === manifest.files['bin/duckonwire-server'], 'FDW tested a different server');
          const files = {};
          for (const file of fs.readdirSync('dist').sort()) {
            files[file] = crypto.createHash('sha256').update(fs.readFileSync(`dist/${file}`)).digest('hex');
          }
          const receipt = { version, tag: process.env.TAG, source_head: head,
            workflow: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            native_checks: 112, postgres_fdw_checks: 20, documentation_and_stock_drivers: 'passed',
            docker_architectures: ['amd64', 'arm64'], runtime_platform: 'Ubuntu 24.04 x86-64-v3',
            native_package: packageName, components: manifest.components, files,
            limitations: ['Native binary requires an x86-64-v3 compatible CPU and Ubuntu 24.04 system libraries.',
              'Docker builds for its native architecture.', 'Neon/FDW tutorial uses a protected read-only account.',
              'PostgreSQL drivers use DuckDB SQL; this is not a complete PostgreSQL server.'] };
          fs.writeFileSync('dist/release.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          (cd dist && sha256sum *.tar.gz *.manifest.json release.json > SHA256SUMS)
          cat > release-notes.txt <<'NOTES'
          Connect your apps to DuckDB with standard PostgreSQL drivers, or use native Quack. This release includes verified TLS, SCRAM accounts, read/write access rules and the read-only Neon postgres_fdw tutorial.

          Explore tables and run real queries with the included Flask playground. It reuses authenticated connections and keeps them ready between visits. A runnable top-prices query shows how to get the same results with less work.

          The same source commit passed 112 native/bootstrap checks, the actual FDW SQL tutorial, stock-driver examples, concurrent workloads and Docker tests on AMD64 and ARM64. Checksums and source pins are included.

          The native binary is for Ubuntu 24.04 on x86-64-v3 CPUs. For ARM64, use Docker or build from the included source. Queries run in DuckDB; full PostgreSQL SQL/catalog/ORM compatibility is not promised.
          NOTES
      - name: Create an immutable tag and publish its tested files
        run: |
          unset GH_TOKEN GITHUB_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
          umask 077
          mkdir "$GH_CONFIG_DIR"
          printf '%s\n' "$WORKFLOW_TOKEN" | gh auth login --hostname github.com --with-token
          # The API fails if another publisher created this tag during the build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          options=()
          if test "$PRERELEASE" = true; then options+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "DoW — Connected DuckDB $VERSION" \
            --notes-file release-notes.txt "${options[@]}" \
            dist/*.tar.gz dist/*.manifest.json dist/*.sha256 dist/release.json dist/SHA256SUMS
      - name: Remove this job's temporary GitHub login
        if: always()
        run: rm -rf "$GH_CONFIG_DIR"
