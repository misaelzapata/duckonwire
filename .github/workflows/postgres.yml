name: PostgreSQL driver compatibility
on:
  workflow_call:
    inputs:
      package_artifact:
        description: Optional fresh native package from this workflow run
        type: string
        default: ''
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DUCKONWIRE_TOKEN: ci-local-test-password
      PGPASSWORD: ci-local-test-password
      PGPORT: '19496'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git libpq-dev libcurl4-openssl-dev libssl-dev python3-venv postgresql postgresql-contrib jq
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.package_artifact != ''
        with:
          name: ${{ inputs.package_artifact }}
          path: build/native-input
      - name: Use the fresh package from this release run
        if: inputs.package_artifact != ''
        run: |
          mkdir -p build/engine build/bin build/test-results
          archives=(build/native-input/*.tar.gz)
          manifests=(build/native-input/*.manifest.json)
          test "${#archives[@]}" = 1
          test "${#manifests[@]}" = 1
          (cd build/native-input && sha256sum --check *.sha256)
          jq -e --arg head "$GITHUB_SHA" '.source_head == $head' "${manifests[0]}"
          tar -xzf "${archives[0]}" -C build/engine --strip-components=1
          ln -s engine/lib build/lib
          for program in duckonwire-server duckonwire-password access-tests scram-tests pgwire-protocol-tests native-tests transaction-flow attach-client attach-tests; do
            cp "build/engine/bin/$program" build/bin/
          done
          git rev-parse HEAD > build/test-results/source-head.txt
          sha256sum src/pgwire.cpp src/server.cpp src/scram.cpp src/access.cpp build/engine/lib/libduckdb.so > build/test-results/provenance.sha256
      - name: Build the current pinned server and protocol tests
        if: inputs.package_artifact == ''
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNATIVE_ARCH=OFF -DCMAKE_C_FLAGS=-march=x86-64-v3 -DCMAKE_CXX_FLAGS=-march=x86-64-v3
          cmake --build build --parallel 2 --target duckonwire-server duckonwire-password access-tests scram-tests pgwire-protocol-tests native-tests transaction-flow attach-client attach-tests
          git rev-parse HEAD > build/test-results/source-head.txt
          sha256sum src/pgwire.cpp src/server.cpp src/scram.cpp src/access.cpp build/lib/libduckdb.so > build/test-results/provenance.sha256
          sha256sum examples/attach.cpp tests/attach_tests.cpp README.md AGENTS.md >> build/test-results/provenance.sha256
      - name: Compile the ordinary libpq client
        run: cc -I"$(pg_config --includedir)" examples/postgres/c/crud.c -L"$(pg_config --libdir)" -lpq -o build/bin/pg-crud
      - name: Verify the guide against the fresh server help
        run: cmake -DSOURCE_DIR="$PWD" -DSERVER_BINARY="$PWD/build/bin/duckonwire-server" -DREPORT_FILE="$PWD/build/test-results/documentation.json" -P cmake/DocumentationTests.cmake
      - name: Native acceptance against the fresh server
        run: |
          build/bin/access-tests --fixture-parent build/test-results | tee build/test-results/access-rules.json
          build/bin/scram-tests | tee build/test-results/scram-authentication.json
          build/bin/pgwire-protocol-tests --server build/bin/duckonwire-server --fixture-parent build/test-results | tee build/test-results/pgwire-protocol.json
          build/bin/native-tests --server build/bin/duckonwire-server --flow build/bin/transaction-flow --catalog examples/demo | tee build/test-results/native.json
          build/bin/attach-tests --server build/bin/duckonwire-server --client build/bin/attach-client --fixture-parent build/test-results | tee build/test-results/attach.json
      - name: Install ordinary drivers
        run: |
          npm ci --prefix examples/postgres/node --ignore-scripts
          python3 -m venv build/pg-python
          build/pg-python/bin/pip install -r examples/postgres/python/requirements.txt
          python3 -m venv build/flask-python
          build/flask-python/bin/pip install -r examples/postgres/flask/requirements.txt
      - name: Actual postgres_fdw tutorial and read-only transactions
        run: |
          build/pg-python/bin/python tests/postgres_fdw.py \
            --server build/bin/duckonwire-server --password-program build/bin/duckonwire-password \
            --pg-bin "$(pg_config --bindir)" --psql "$(pg_config --bindir)/psql" \
            --fixture-parent build/fdw-fixtures | tee build/test-results/postgres-fdw.json
          jq -e '.passed and .owned_fixture_cleanup_complete and (.checks | length == 20) and all(.checks[]; .passed)' build/test-results/postgres-fdw.json
          printf '## PostgreSQL FDW\n\n20 actual checks passed using the public setup/query/cleanup SQL, a protected reader and verified TLS. These are separate from the native/bootstrap checks.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Stock drivers and two million rows with complex reads
        run: |
          mkdir -p build/pg-fixture
          build/bin/duckonwire-server --root "$PWD/build/pg-fixture" --port 19495 --pg-port "$PGPORT" > build/test-results/server.log 2>&1 &
          owner_pid=$!
          trap 'kill -TERM "$owner_pid" 2>/dev/null || true; wait "$owner_pid" || true' EXIT
          for attempt in {1..100}; do
            if test -s build/pg-fixture/.runtime/native.json; then break; fi
            kill -0 "$owner_pid"
            sleep 0.1
          done
          test -s build/pg-fixture/.runtime/native.json
          build/bin/pg-crud | tee build/test-results/libpq-crud.json
          build/pg-python/bin/python examples/postgres/python/crud.py | tee build/test-results/psycopg-crud.json
          node examples/postgres/node/crud.mjs | tee build/test-results/node-crud.json
          node examples/postgres/node/bulk.mjs | tee build/test-results/node-bulk.json
          kill -TERM "$owner_pid"
          wait "$owner_pid"
          trap - EXIT
          test ! -e build/pg-fixture/.runtime/native.json
      - name: TLS and SCRAM with ordinary drivers
        run: |
          mkdir -p build/tls-fixture
          chmod 700 build/tls-fixture
          # Import the public CSV catalog while this owned fixture is local.
          # Protected accounts cannot import external files.
          mkdir -p build/tls-fixture/examples/demo
          cp examples/demo/products.csv examples/demo/prices.csv build/tls-fixture/examples/demo/
          build/bin/duckonwire-server --root "$PWD/build/tls-fixture" --port 19495 --pg-port "$PGPORT" --init-demo --demo-prices 1000000 > build/test-results/tls-catalog-init.log 2>&1 &
          owner_pid=$!
          trap 'kill -TERM "$owner_pid" 2>/dev/null || true; wait "$owner_pid" || true' EXIT
          for attempt in {1..100}; do
            if test -s build/tls-fixture/.runtime/native.json; then break; fi
            kill -0 "$owner_pid"
            sleep 0.1
          done
          test -s build/tls-fixture/.runtime/native.json
          kill -TERM "$owner_pid"
          wait "$owner_pid"
          trap - EXIT
          test ! -e build/tls-fixture/.runtime/native.json
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -subj '/CN=DuckOnWire isolated test CA' -addext 'basicConstraints=critical,CA:TRUE' -keyout build/tls-fixture/ca-key.pem -out build/tls-fixture/ca.pem 2>build/tls-fixture/cert-generation.log
          openssl req -new -newkey rsa:2048 -nodes -sha256 -subj /CN=localhost -keyout build/tls-fixture/key.pem -out build/tls-fixture/server.csr 2>>build/tls-fixture/cert-generation.log
          cat > build/tls-fixture/server.ext <<'CERT'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost,IP:127.0.0.1
          CERT
          openssl x509 -req -sha256 -days 1 -in build/tls-fixture/server.csr -CA build/tls-fixture/ca.pem -CAkey build/tls-fixture/ca-key.pem -CAcreateserial -extfile build/tls-fixture/server.ext -out build/tls-fixture/cert.pem 2>>build/tls-fixture/cert-generation.log
          chmod 600 build/tls-fixture/key.pem build/tls-fixture/ca-key.pem
          export PGPASSWORD='isolated-ci-credential-with-at-least-thirty-two-characters'
          verifier=$(printf '%s\n' "$PGPASSWORD" | build/bin/duckonwire-password)
          export PGREADER_USER=reader PGREADER_PASSWORD='isolated-ci-reader-with-at-least-thirty-two-characters'
          reader_verifier=$(printf '%s\n' "$PGREADER_PASSWORD" | build/bin/duckonwire-password)
          printf 'database\tduckonwire\nuser\tduckonwire\twrite\t%s\nuser\treader\tread\t%s\n' "$verifier" "$reader_verifier" > build/tls-fixture/access.tsv
          chmod 600 build/tls-fixture/access.tsv
          # This benchmark sends millions of bound values and concurrent reads.
          # Give it an explicit traffic budget; abuse fixtures test the defaults separately.
          build/bin/duckonwire-server --root "$PWD/build/tls-fixture" --port 19495 --pg-port "$PGPORT" --access-file access.tsv --tls-cert cert.pem --tls-key key.pem --max-requests-per-minute 60000 > build/test-results/tls-server.log 2>&1 &
          owner_pid=$!
          trap 'kill -TERM "$owner_pid" 2>/dev/null || true; wait "$owner_pid" || true' EXIT
          for attempt in {1..100}; do
            if test -s build/tls-fixture/.runtime/native.json; then break; fi
            kill -0 "$owner_pid"
            sleep 0.1
          done
          test -s build/tls-fixture/.runtime/native.json
          export PGSSLMODE=verify-full PGSSLROOTCERT="$PWD/build/tls-fixture/ca.pem"
          PGHOST=localhost build/flask-python/bin/python tests/flask_playground.py | tee build/test-results/flask-playground.json
          build/bin/pg-crud | tee build/test-results/tls-libpq-crud.json
          build/pg-python/bin/python examples/postgres/python/crud.py | tee build/test-results/tls-psycopg-crud.json
          node examples/postgres/node/crud.mjs | tee build/test-results/tls-node-crud.json
          # Normal username/password login through the standard pg driver.
          # The actual reader account must query and must not insert a row.
          (
            cd examples/postgres/node
            node --input-type=module <<'NODE'
          import { Client } from 'pg';
          import { readFileSync } from 'node:fs';
          const config = { host: process.env.PGHOST ?? '127.0.0.1', port: Number(process.env.PGPORT),
            user: process.env.PGUSER ?? 'duckonwire', database: process.env.PGDATABASE ?? 'duckonwire',
            password: process.env.PGPASSWORD, ssl: { ca: readFileSync(process.env.PGSSLROOTCERT), rejectUnauthorized: true } };
          const writer = new Client(config);
          const reader = new Client({ ...config, user: process.env.PGREADER_USER, password: process.env.PGREADER_PASSWORD });
          const label = 'PostgreSQL CI reader denial';
          try {
            await writer.connect(); await reader.connect();
            const existing = await reader.query('SELECT count(*) AS n FROM pg_demo_products');
            if (BigInt(existing.rows[0].n) < 1n) throw new Error('Reader could not query writer-created rows');
            let rejected = false;
            try { await reader.query('INSERT INTO pg_demo_products VALUES($1,$2,$3,$4,$5)', [label, 1, 'Denied row', '1.00', 1]); }
            catch (error) { if (error.code !== '42501') throw error; rejected = true; }
            if (!rejected) throw new Error('Reader inserted a row');
            const state = await writer.query('SELECT count(*) AS n FROM pg_demo_products WHERE client=$1', [label]);
            if (BigInt(state.rows[0].n) !== 0n) throw new Error('Denied insert changed shared state');
            console.log(JSON.stringify({ passed: true, driver: 'pg', sslmode: 'verify-full',
              readerSelectAllowed: true, readerInsertSqlstate: '42501', sharedStateUnchanged: true }));
          } finally { await Promise.allSettled([reader.end(), writer.end()]); }
          NODE
          ) | tee build/test-results/tls-reader-permissions.json
          # Every price value is constructed by the client and bound over TLS.
          PGUSER="$PGREADER_USER" PGPASSWORD="$PGREADER_PASSWORD" PG_LATENCY_SAMPLES=3 PG_LATENCY_WARMUPS=1 PG_LATENCY_PAUSE_MS=20 node examples/postgres/node/latency.mjs | tee build/test-results/tls-query-latency.json
          jq -e '.passed and (.data.prices | tonumber == 1000000) and (.results | length == 10) and all(.results[]; .samples == 3)' build/test-results/tls-query-latency.json
          PG_DEMO_READS=1 PG_INGEST_ROWS=2000000 node examples/postgres/node/ingest.mjs | tee build/test-results/tls-values-ingestion.json
          jq -e '.passed and .rows == 2000000 and .demoReferenceQueries == 10 and .demoQueriesVerified == 10 and .demoQueriesOverlappingWrites == 10' build/test-results/tls-values-ingestion.json
          node examples/postgres/node/bulk.mjs | tee build/test-results/tls-node-bulk.json
          kill -TERM "$owner_pid"
          wait "$owner_pid"
          trap - EXIT
          test ! -e build/tls-fixture/.runtime/native.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: postgres-linux-results
          path: |
            build/test-results/*.json
            build/test-results/*.log
            build/test-results/*.sha256
            build/test-results/source-head.txt
