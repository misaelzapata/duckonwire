name: Docker native architectures
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, compose.yaml, 'docker/**', 'src/**', 'include/**', 'cmake/**', CMakeLists.txt, 'patches/**', 'tests/**', 'examples/**', '.github/workflows/docker.yml']
  pull_request:
    paths: [Dockerfile, .dockerignore, compose.yaml, 'docker/**', 'src/**', 'include/**', 'cmake/**', CMakeLists.txt, 'patches/**', 'tests/**', 'examples/**', '.github/workflows/docker.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: duckonwire-ci
      DUCKONWIRE_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build and cache the native architecture
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: duckonwire-local:latest
          build-args: BUILD_JOBS=4
          cache-from: type=gha,scope=duckonwire-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=duckonwire-${{ matrix.architecture }},ignore-error=true
      - name: Start protected PostgreSQL
        run: |
          docker compose config --quiet
          docker compose up --detach --no-build --wait --wait-timeout 90
          test "$(docker inspect --format '{{.Architecture}}' "$(docker compose images -q duckonwire)")" = '${{ matrix.architecture }}'
          test "$(docker compose exec -T duckonwire id -u)" = 10001
          mkdir -p test-results
      - name: Installed native sessions, PostgreSQL protocol, access and SCRAM
        run: |
          docker compose exec -T duckonwire /opt/duckonwire/bin/native-tests \
            --server /opt/duckonwire/bin/duckonwire-server --flow /opt/duckonwire/bin/transaction-flow \
            --catalog /opt/duckonwire/examples/demo | tee test-results/native.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/attach-tests \
            --server /opt/duckonwire/bin/duckonwire-server --client /opt/duckonwire/bin/attach-client \
            --fixture-parent /tmp | tee test-results/attach.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/pgwire-protocol-tests \
            --server /opt/duckonwire/bin/duckonwire-server | tee test-results/pgwire.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/access-tests | tee test-results/access.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/database-routing-tests | tee test-results/routing.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/peer-guard-tests | tee test-results/peer-protection.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/quack-access-tests \
            --server /opt/duckonwire/bin/duckonwire-server --fixture-parent /tmp | tee test-results/native-access.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/pg-peer-guard-tests \
            --server /opt/duckonwire/bin/duckonwire-server --fixture-parent /tmp | tee test-results/pg-peer-protection.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/read-copy-tests \
            --server /opt/duckonwire/bin/duckonwire-server --fixture-parent /tmp | tee test-results/read-copy-refresh.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/scram-tests | tee test-results/scram.json
          docker compose exec -T duckonwire /opt/duckonwire/bin/duckonwire-benchmark \
            --server /opt/duckonwire/bin/duckonwire-server --mode both --rows 10000 --batch 250 \
            --environment 'Native Docker ${{ matrix.architecture }}' --output /tmp/native-smoke.json
          docker compose exec -T duckonwire cat /tmp/native-smoke.json > test-results/native-smoke.json
      - name: Ordinary verified TLS login, CRUD, snapshots, reader rules and client ingestion
        run: |
          npm ci --prefix examples/postgres/node --ignore-scripts
          docker compose exec -T duckonwire cat /var/lib/duckonwire/.runtime/tls/ca.pem > test-results/ca.pem
          export PGHOST=127.0.0.1 PGPORT=9496 PGUSER=writer PGDATABASE=duckonwire
          export PGSSLMODE=verify-full PGSSLROOTCERT="$PWD/test-results/ca.pem"
          export PGPASSWORD="$(docker compose exec -T duckonwire cat /var/lib/duckonwire/.runtime/writer.password)"
          export PGREADER_USER=reader
          export PGREADER_PASSWORD="$(docker compose exec -T duckonwire cat /var/lib/duckonwire/.runtime/reader.password)"
          node examples/postgres/node/crud.mjs | tee test-results/node-crud.json
          (
            cd examples/postgres/node
            node --input-type=module <<'NODE'
          import { Client } from 'pg';
          import { readFileSync } from 'node:fs';
          const settings = { ssl: { ca: readFileSync(process.env.PGSSLROOTCERT), rejectUnauthorized: true } };
          const writer = new Client(settings);
          const reader = new Client({ ...settings, user: process.env.PGREADER_USER, password: process.env.PGREADER_PASSWORD });
          const stock = async client => Number((await client.query('SELECT stock FROM docker_snapshot WHERE id=$1', [1])).rows[0].stock);
          try {
            await writer.connect(); await reader.connect();
            await writer.query('CREATE TABLE docker_snapshot(id INTEGER PRIMARY KEY, stock INTEGER)');
            await writer.query('INSERT INTO docker_snapshot VALUES($1,$2)', [1,3]);
            await reader.query('BEGIN');
            if (await stock(reader) !== 3) throw new Error('Initial reader stock');
            await writer.query('BEGIN');
            await writer.query('UPDATE docker_snapshot SET stock=$1 WHERE id=$2', [4,1]);
            await writer.query('COMMIT');
            if (await stock(reader) !== 3) throw new Error('Snapshot changed before reader commit');
            await reader.query('COMMIT'); await reader.query('BEGIN');
            if (await stock(reader) !== 4) throw new Error('New snapshot missed writer commit');
            await reader.query('COMMIT');
            let denied = false;
            try { await reader.query('INSERT INTO docker_snapshot VALUES($1,$2)', [2,99]); }
            catch (error) { if (error.code !== '42501') throw error; denied = true; }
            if (!denied || Number((await writer.query('SELECT count(*) AS n FROM docker_snapshot')).rows[0].n) !== 1)
              throw new Error('Reader write was not denied without changes');
            await writer.query('DROP TABLE docker_snapshot');
            console.log(JSON.stringify({ passed: true, driver: 'pg', TLS: 'verify-full', snapshot: [3,3,4], readerInsertSqlstate: '42501' }));
          } finally { await Promise.allSettled([reader.end(), writer.end()]); }
          NODE
          ) | tee test-results/node-snapshots.json
          PG_INGEST_ROWS=100000 node examples/postgres/node/ingest.mjs | tee test-results/client-values.json
          # A row survives a graceful container stop/start on the named volume.
          docker compose exec -T duckonwire psql -X -q -v ON_ERROR_STOP=1 \
            -c 'CREATE TABLE docker_persistence(id INTEGER PRIMARY KEY); INSERT INTO docker_persistence VALUES(42)'
          docker compose stop
          docker compose up --detach --wait --wait-timeout 90
          test "$(docker compose exec -T duckonwire psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT id FROM docker_persistence')" = 42
          test "$(docker compose exec -T -e PGUSER=reader duckonwire psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT id FROM docker_persistence')" = 42
          docker compose exec -T duckonwire psql -X -q -v ON_ERROR_STOP=1 -c 'DROP TABLE docker_persistence'
      - name: Capture sanitized runtime provenance
        run: |
          docker compose exec -T duckonwire sh -c 'uname -m; sha256sum /opt/duckonwire/bin/duckonwire-server /opt/duckonwire/lib/libduckdb.so' > test-results/runtime.sha256
          git rev-parse HEAD > test-results/source-head.txt
          docker compose logs --no-color > test-results/server.log
      - name: Remove only this job's container and named volume
        if: always()
        run: docker compose down --volumes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: docker-native-${{ matrix.architecture }}
          path: |
            test-results/*.json
            test-results/*.sha256
            test-results/source-head.txt
            test-results/server.log
          if-no-files-found: warn
